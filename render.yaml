services:
  - type: web
    name: sportlens-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin Python to avoid unexpected default runtime jumps.
      - key: PYTHON_VERSION
        value: 3.13.5

      # Non-secret defaults
      - key: API_HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: "*"

      # Set these in Render dashboard (Environment) with real values.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
