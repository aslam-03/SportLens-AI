<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportLens AI | Coaching App</title>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    
    <!-- TensorFlow.js + COCO-SSD for person detection (BEFORE pose estimation) -->
    <script async src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

    <!-- MediaPipe CDN scripts for pose detection -->
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
